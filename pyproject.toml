[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courses-variant08"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.118,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "testcontainers[postgres]>=4.8,<5",
    "pytest-random-order>=1.2",
    "pytest-html>=4.1,<5",
]
regression = [
    "pytest>=8,<9",
    "testcontainers[postgres]>=4.8,<5",
    "pytest-random-order>=1.2",
]

[tool.setuptools.packages.find]
include = ["courses*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_regression.py"]
markers = [
    "unit: Fast isolated unit tests without DB or Docker",
    "smoke: Quick critical path smoke tests (subset of regression suite)",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning",
]
